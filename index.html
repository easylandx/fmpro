<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMPro</title>
<meta name="description" content="Classic AM/FM stereo radio receiver and player.">
<meta name="theme-color" content="#0a1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FMPro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="fmpro.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#02060f;--neon:#19d3ff;--neon2:#2f7bff;--hi:#d9f9ff;--dim:#6fb9d6;--panel:#041226;--glass:#020b19;--glow:0 0 10px #19d3ff99,0 0 22px #19d3ff44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#0b2c5c 0,#050d1f 45%,#01040a 100%) fixed;color:var(--hi);font-family:'Share Tech Mono',monospace;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) clamp(14px,4vw,28px) max(30px,env(safe-area-inset-bottom))}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 10px}
h1 a{color:inherit;text-decoration:none}
.brand{display:flex;align-items:center;gap:12px}
#logo img{display:block;width:clamp(34px,8vw,46px);height:clamp(34px,8vw,46px);border-radius:22%;box-shadow:0 0 12px #19d3ff88}
h1{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(20px,5vw,32px);margin:0;color:var(--neon);letter-spacing:3px;text-shadow:var(--glow)}
.lang{background:#05182c;border:1px solid var(--neon);color:var(--neon);padding:6px 14px;border-radius:20px;font:inherit;cursor:pointer;box-shadow:inset 0 0 8px #19d3ff33,0 0 10px #19d3ff55;text-shadow:0 0 6px var(--neon)}

/* ---------- photo radio ---------- */
.stagewrap{position:relative;margin:0 -2%}
.stagewrap::before{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:30%;background:radial-gradient(ellipse at center,#19d3ff55,transparent 70%);filter:blur(24px);pointer-events:none}
.stage{position:relative;width:100%;aspect-ratio:1024/540;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);
  mask-composite:intersect;user-select:none;-webkit-user-select:none}
.stage img{display:block;width:100%;height:100%;pointer-events:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hit{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:6px;touch-action:manipulation}
.hit:focus-visible{outline:2px solid var(--neon)}
.hit.k{border-radius:50%;cursor:grab;touch-action:none}
.hit.k:active{cursor:grabbing}
.hit.d{cursor:ew-resize;touch-action:none}

/* ---------- virtual panel ---------- */
.radio{display:none;margin-top:6px;background:linear-gradient(160deg,#061a33,#030b18);border:1px solid var(--neon);border-radius:22px;padding:clamp(14px,4vw,26px);box-shadow:0 0 24px #19d3ff44,inset 0 0 28px #19d3ff1a}
.glass{background:var(--glass);border:1px solid #19d3ff66;border-radius:12px;padding:16px 18px;box-shadow:inset 0 0 30px #000,inset 0 0 14px #19d3ff22}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.freq{font-size:clamp(34px,10vw,56px);color:var(--neon);text-shadow:0 0 16px #19d3ffcc,0 0 4px #fff;line-height:1}
.freq small{font-size:.4em;opacity:.85;margin-left:6px}
.led{width:12px;height:12px;border-radius:50%;background:#0a2a3a;box-shadow:0 0 0 2px #0006;display:inline-block;margin-right:6px}
.led.on{background:#fff;box-shadow:0 0 12px var(--neon),0 0 4px #fff}
#onair{color:var(--dim)}
.name{margin-top:10px;font-size:clamp(16px,4.5vw,22px);color:var(--hi);text-shadow:0 0 8px #19d3ff88;min-height:1.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--dim);min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;gap:3px;align-items:flex-end;height:38px}
.bars i{width:5px;background:linear-gradient(#d9f9ff,var(--neon));height:4px;border-radius:1px;box-shadow:0 0 6px #19d3ff99}
.dial{position:relative;margin:18px 0 6px;height:54px;border-top:1px solid #19d3ff66}
.ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#19d3ffcc 0 1px,transparent 1px 5%);opacity:.5}
.labels{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.needle{position:absolute;top:0;bottom:14px;width:2px;background:#fff;box-shadow:0 0 8px var(--neon),0 0 14px var(--neon);left:0;transition:left .08s}
.dots{position:absolute;inset:0 0 14px 0}
.dots b{position:absolute;top:4px;width:5px;height:5px;border-radius:50%;background:var(--neon);opacity:.8;box-shadow:0 0 6px var(--neon);transform:translateX(-50%)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#000a;border:1px solid #19d3ff66;border-radius:5px}
input[type=range]::-moz-range-track{height:8px;background:#000a;border:1px solid #19d3ff66;border-radius:5px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#19d3ff 60%,#0a6fa0);border:2px solid #02101f;box-shadow:0 0 14px var(--neon)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#19d3ff 60%,#0a6fa0);border:2px solid #02101f;box-shadow:0 0 14px var(--neon)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
button.b{background:#05182c;color:var(--neon);border:1px solid var(--neon);border-radius:10px;padding:12px 16px;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 0 10px #19d3ff66,inset 0 0 8px #19d3ff33;text-shadow:0 0 6px var(--neon)}
button.b:active{transform:translateY(2px)}
button.b.on{background:var(--neon);color:#021018;text-shadow:none;box-shadow:0 0 18px var(--neon),0 0 36px #19d3ff66}
.vol{display:flex;align-items:center;gap:8px;flex:1;min-width:150px}
.vol input{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 10px}
.chip{background:#031020;border:1px solid #19d3ff88;color:var(--neon);border-radius:20px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;text-shadow:0 0 5px #19d3ff88}
.chip.on{background:var(--neon);color:#021018;border-color:var(--neon);box-shadow:0 0 14px var(--neon);text-shadow:none}
.chip.wa{background:#25D366;border-color:#25D366;color:#fff;box-shadow:0 0 12px #25D36688;text-shadow:none}
.chip.wa:hover,.chip.wa:active{background:#1ebe5b;border-color:#1ebe5b}
select,input[type=search]{background:#031020;border:1px solid #19d3ff88;color:var(--hi);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;min-width:0;box-shadow:inset 0 0 8px #19d3ff22}
select:focus,input[type=search]:focus{outline:none;border-color:var(--neon);box-shadow:0 0 12px #19d3ff88}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input[type=search]{flex:1;min-width:140px}
.list{margin-top:14px;max-height:330px;overflow:auto;border-radius:12px;background:#02101fcc;border:1px solid #19d3ff44;padding:6px}
.st{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.st:hover{background:#19d3ff1c}
.st.cur{background:#19d3ff33;color:#fff;box-shadow:inset 0 0 12px #19d3ff55}
.st span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st span:last-child{color:var(--neon);flex:none;text-shadow:0 0 6px var(--neon)}
.status{margin-top:10px;font-size:13px;color:var(--dim);min-height:1.2em}
footer{text-align:center;font-size:12px;color:#4d86a0;padding:22px 10px 0}

#power h2{font-family:'Orbitron',sans-serif;color:var(--neon);font-size:clamp(26px,8vw,44px);margin:0;letter-spacing:4px;text-shadow:var(--glow)}
#power p{color:var(--hi);text-shadow:0 0 6px #000,0 0 14px #000,0 0 22px #000}
#power h2{text-shadow:0 0 8px #000,0 0 18px #000,var(--glow)}
#power{cursor:pointer}
#power button{background:#05182c;color:var(--neon);border:2px solid var(--neon);border-radius:50px;padding:18px 44px;font:inherit;font-size:22px;cursor:pointer;box-shadow:0 0 30px #19d3ff99,inset 0 0 18px #19d3ff44;text-shadow:0 0 10px var(--neon)}
.hr{display:flex;align-items:center;gap:8px}
#instBtn{display:none}
#iosTip{display:none;margin:2px 4px 8px;padding:8px 14px;font-size:13px;color:var(--dim);background:#031020;border:1px solid #19d3ff55;border-radius:10px;text-align:center}

/* ---------- nav transport buttons ---------- */
header{flex-wrap:wrap}
.tb{display:flex;gap:clamp(2px,1vw,8px);align-items:stretch;padding:6px clamp(6px,1.5vw,12px);background:linear-gradient(180deg,#041a30,#020b19);border:1px solid #19d3ff66;border-radius:12px;box-shadow:inset 0 0 18px #000,inset 0 0 10px #19d3ff22,0 0 12px #19d3ff33}
.tb button{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:0;border-radius:8px;padding:6px clamp(7px,2vw,16px) 5px;font-family:'Orbitron',sans-serif;font-weight:600;font-size:clamp(10px,2.6vw,13px);letter-spacing:1.5px;color:var(--neon);text-shadow:0 0 8px #19d3ffaa;cursor:pointer;touch-action:manipulation;min-width:0}
.tb button i{display:block;width:7px;height:7px;border-radius:50%;background:#0a2a3a;box-shadow:inset 0 0 3px #000,0 0 0 1px #19d3ff33;transition:.15s}
.tb button:hover{background:#19d3ff14}
.tb button:active{transform:translateY(1px);background:#19d3ff26}
.tb button:focus-visible{outline:2px solid var(--neon)}
.tb button.on i{background:#fff;box-shadow:0 0 8px var(--neon),0 0 14px var(--neon)}
.tb button.on{color:#fff;text-shadow:0 0 10px var(--neon),0 0 18px var(--neon)}
@media(max-width:640px){.tb{order:3;flex:1 0 100%;justify-content:space-around}}

header{position:sticky;top:0;z-index:40;margin:0 calc(-1*clamp(14px,4vw,28px));padding:max(8px,env(safe-area-inset-top)) clamp(14px,4vw,28px) 10px;background:linear-gradient(#02060ff2 75%,#02060f00);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.song{margin-top:2px;min-height:1.5em;font-size:clamp(13px,3.6vw,16px);color:var(--neon);text-shadow:0 0 8px #19d3ff99;overflow:hidden;white-space:nowrap;position:relative}
.song .mq{display:inline-block;padding-left:0;animation:songmq var(--d,14s) linear infinite}
.song .mq span{padding-right:3em}
@keyframes songmq{to{transform:translateX(-50%)}}
</style>

function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
  const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=2500;f.Q.value=.4;
  noiseGain=ctx.createGain();noiseGain.gain.value=0;
  src.connect(f).connect(noiseGain).connect(ctx.destination);src.start();
  try{
    const ms=ctx.createMediaElementSource(aC);
    an=ctx.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.55;
    master=ctx.createGain();
    ms.connect(an);an.connect(master);master.connect(ctx.destination);
    fd=new Uint8Array(an.frequencyBinCount);td=new Uint8Array(an.fftSize);
  }catch(e){an=null;master=null}
  applyVolume();
}

  $('needle').style.left=(pos*100)+'%';$('freq').textContent=fr.toFixed(1);
  if(!powered||!stations.length)return;
  let best=0,bd=9;stations.forEach((s,i)=>{const dd=Math.abs(s.pos-pos);if(dd<bd){bd=dd;best=i}});
  const gap=.5/stations.length;
  clearTimeout(tuneTimer);
  if(bd<gap*.6){
    tuneTimer=setTimeout(()=>{if(best!==cur||audio.paused)tuneTo(best,false)},250);
  }else{
    noise(true);$('status').textContent=t('noise');stopAudio();playFlag=false;$('name').textContent='~~~~~';$('meta').textContent='';cur=-1;
    document.querySelectorAll('.st').forEach(e=>e.classList.remove('cur'));

/* ============ equalizer bars (virtual panel) ============ */
const NB=28,bars=new Array(NB).fill(0),tgt=new Array(NB).fill(0);
$('bars').innerHTML='<i></i>'.repeat(NB);
const barEls=[...$('bars').children];
let vu=0,kick=0,nextKick=0;

function analyse(now){
  let lvl=0;
  const live=powered&&playFlag&&!buffering;
  if(live&&audio===aC&&an){
    an.getByteFrequencyData(fd);an.getByteTimeDomainData(td);
    let s=0,dev=0;
    for(let i=0;i<td.length;i++){const v=(td[i]-128)/128;s+=v*v;dev=Math.max(dev,Math.abs(td[i]-128))}
    lvl=clamp(Math.sqrt(s/td.length)*3.4);
    for(let i=0;i<NB;i++){
      const a=Math.floor(Math.pow(i/NB,1.7)*170)+1,b=Math.max(a+1,Math.floor(Math.pow((i+1)/NB,1.7)*170)+2);
      let m=0;for(let k=a;k<b;k++)m=Math.max(m,fd[k]);
      tgt[i]=Math.pow(m/255,1.7)*1.15;
    }
    /* safety net: graph gives only silence (some browsers) -> fall back to plain audio */
    if(dev<1&&++zc>300&&cur>=0){zc=0;stations[cur].cors=false;playStream(stations[cur])}else if(dev>=1)zc=0;
  }else if(live){
    if(now>nextKick){kick=1;nextKick=now+380+Math.random()*320}
    kick*=.93;
    lvl=.30+.32*kick+.14*Math.random();
    for(let i=0;i<NB;i++)tgt[i]=lvl*(1.05-.6*i/NB)*(.4+.6*Math.random());
  }else if(powered&&noiseOn){
    lvl=.05*Math.random();
    for(let i=0;i<NB;i++)tgt[i]=.04+.2*Math.random()*(.4+.6*(1-i/NB));
  }else{
    for(let i=0;i<NB;i++)tgt[i]=0;
  }
  if(muted){lvl*=.0;}
  for(let i=0;i<NB;i++)bars[i]=tgt[i]>bars[i]?bars[i]+(tgt[i]-bars[i])*.7:bars[i]*.88;
  vu+=(lvl-vu)*(lvl>vu?.35:.07);
  for(let i=0;i<NB;i++)barEls[i].style.height=(4+clamp(bars[i])*34)+'px';
}

function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function panel(x,y,w,h){
  rr(x,y,w,h,7);
  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'rgba(2,9,22,.97)');gr.addColorStop(1,'rgba(3,22,46,.97)');
  g.fillStyle=gr;g.fill();
  g.lineWidth=1.5;g.strokeStyle='rgba(25,211,255,.5)';g.stroke();
}
function glowText(str,x,y,size,col,align,blur){
  g.font=size+"px 'Share Tech Mono',monospace";g.textAlign=align||'left';g.fillStyle=col||NEON;
  g.shadowColor=NEON;g.shadowBlur=blur==null?9:blur;g.fillText(str,x,y);g.shadowBlur=0;
}
function marquee(str,x,y,w,size,col,now){
  g.font=size+"px 'Share Tech Mono',monospace";g.textAlign='left';
  const tw=g.measureText(str).width;
  g.save();g.beginPath();g.rect(x,y-size,w,size+5);g.clip();
  g.fillStyle=col;g.shadowColor=NEON;g.shadowBlur=8;
  if(tw<=w)g.fillText(str,x,y);
  else{const gap=60,off=(now/32)%(tw+gap);g.fillText(str,x-off,y);g.fillText(str,x-off+tw+gap,y)}
  g.restore();
}
function flag(str,x,y,on){
  g.font="10px 'Share Tech Mono',monospace";g.textAlign='left';
  g.fillStyle=on?HI:'rgba(25,211,255,.22)';
  if(on){g.shadowColor=NEON;g.shadowBlur=9}
  g.fillText(str,x,y);g.shadowBlur=0;
}
function segBar(x,w,yb,val,segs,pitch){
  const n=Math.round(clamp(val)*segs);
  for(let j=0;j<segs;j++){
    const y=yb-(j+1)*pitch+1;
    if(j<n){g.fillStyle=j>=segs-2?HI:NEON;g.shadowColor=NEON;g.shadowBlur=j>=segs-2?8:4}
    else{g.fillStyle='rgba(25,211,255,.09)';g.shadowBlur=0}
    g.fillRect(x,y,w,pitch-1);
  }
  g.shadowBlur=0;
}
function meter(x,y,w,h,val,label,center,A){
  panel(x,y,w,h);
  g.save();rr(x,y,w,h,7);g.clip();g.globalAlpha=A;
  const cx=x+w/2,py=y+h-8,R=h-28;
  g.lineWidth=1.2;
  for(let i=0;i<=10;i++){
    const a=(-50+i*10)*Math.PI/180,hot=center?i===5:i>=8,l=hot?9:6;
    g.strokeStyle=hot?HI:'rgba(25,211,255,.8)';
    g.beginPath();g.moveTo(cx+Math.sin(a)*(R-l),py-Math.cos(a)*(R-l));g.lineTo(cx+Math.sin(a)*R,py-Math.cos(a)*R);g.stroke();
  }
  g.beginPath();g.strokeStyle='rgba(25,211,255,.45)';g.arc(cx,py,R,(-90-50)*Math.PI/180,(-90+50)*Math.PI/180);g.stroke();
  const a=(center?val*50:-50+val*100)*Math.PI/180;
  g.strokeStyle='#fff';g.lineWidth=1.8;g.shadowColor=NEON;g.shadowBlur=9;
  g.beginPath();g.moveTo(cx,py);g.lineTo(cx+Math.sin(a)*(R+3),py-Math.cos(a)*(R+3));g.stroke();
  g.shadowBlur=0;g.fillStyle=NEON;g.beginPath();g.arc(cx,py,3,0,7);g.fill();
  glowText(label,x+7,y+13,9,HI,'left',6);
  g.restore();
}
function led(x,y,on){
  g.save();g.beginPath();g.arc(x,y,3,0,7);
  if(on){g.fillStyle=HI;g.shadowColor=NEON;g.shadowBlur=11}else g.fillStyle='rgba(25,211,255,.2)';
  g.fill();g.restore();
}
function inlay(x,y,w,h){
  rr(x,y,w,h,5);g.fillStyle='rgba(2,10,22,.96)';g.fill();g.lineWidth=1;g.strokeStyle='rgba(25,211,255,.5)';g.stroke();
}

let smoothTune=0;
function draw(now){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
  g.setTransform(sc,0,0,sc,0,-Y0*sc);
  const A=powered?1:.3,pos=clamp($('tune').value/1000);
  const playing=powered&&playFlag&&!buffering;
  const fr=88+pos*20;

  /* ----- left dial ----- */
  panel(98,376,382,128);
  g.save();rr(98,376,382,128,7);g.clip();g.globalAlpha=A;
  const x0=130,dw=315,yb=428;
  glowText('FM',110,394,11,HI,'left',6);glowText('MHz',444,394,11,HI,'right',6);
  g.lineWidth=1.2;g.strokeStyle='rgba(25,211,255,.85)';
  for(let i=0;i<=40;i++){
    const x=x0+i/40*dw,hh=i%4===0?15:i%2===0?10:6;
    g.beginPath();g.moveTo(x,yb);g.lineTo(x,yb-hh);g.stroke();
  }
  g.beginPath();g.moveTo(x0,yb);g.lineTo(x0+dw,yb);g.stroke();
  for(let f=88;f<=108;f+=2)glowText(String(f),x0+(f-88)/20*dw,yb+15,11,'rgba(180,240,255,.9)','center',4);
  stations.forEach((s,i)=>{
    const x=x0+s.pos*dw,c=i===cur;
    g.fillStyle=c?HI:'rgba(25,211,255,.55)';
    if(c){g.shadowColor=NEON;g.shadowBlur=9}
    g.beginPath();g.arc(x,yb-22,c?2.6:1.5,0,7);g.fill();g.shadowBlur=0;
  });
  const nx=x0+pos*dw;
  g.strokeStyle='#fff';g.lineWidth=2;g.shadowColor=NEON;g.shadowBlur=12;
  g.beginPath();g.moveTo(nx,yb-34);g.lineTo(nx,yb+22);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.moveTo(nx-4,yb-38);g.lineTo(nx+4,yb-38);g.lineTo(nx,yb-31);g.fill();g.shadowBlur=0;
  const bw=(dw+30)/NB;
  for(let i=0;i<NB;i++)segBar(112+i*bw+bw*.12,bw*.76,500,bars[i],9,4.3);
  g.restore();

  /* ----- right display ----- */
  panel(482,376,254,128);
  g.save();rr(482,376,254,128,7);g.clip();g.globalAlpha=A;
  let nd=9,gap=.5/Math.max(1,stations.length),near=null;
  stations.forEach(s=>{const d=Math.abs(s.pos-pos);if(d<nd){nd=d;near=s}});
  const locked=powered&&cur>=0&&near&&nd<gap*.6;
  flag(t('f_stereo'),496,393,playing);flag(t('f_scan'),548,393,scanning);flag(t('f_mute'),592,393,muted);flag(t('f_afc'),636,393,locked);
  glowText(fr.toFixed(1),492,438,50,HI,'left',14);
  const fw=(g.font="50px 'Share Tech Mono',monospace",g.measureText(fr.toFixed(1)).width);
  glowText('MHz',492+fw+8,438,15,NEON,'left',8);
  const nm=$('name').textContent,mt=$('meta').textContent;
  marquee(nm,494,462,230,15,HI,now);
  if(song&&powered&&playFlag)marquee('\u266A '+song,494,478,230,11,HI,now);
  else glowText(mt,494,478,11,'rgba(130,215,240,.95)','left',4);
  const nl=Math.round(vu*16);
  for(let i=0;i<16;i++){
    const on=i<nl;g.fillStyle=on?(i>=14?HI:NEON):'rgba(25,211,255,.10)';
    if(on){g.shadowColor=NEON;g.shadowBlur=6}else g.shadowBlur=0;
    g.fillRect(494+i*14.5,488,10,6);
  }
  g.shadowBlur=0;g.restore();

  /* ----- band plate above meters ----- */
  panel(740,376,177,48);
  g.save();rr(740,376,177,48,7);g.clip();g.globalAlpha=A;
  glowText('AM / FM',752,396,13,HI,'left',8);
  glowText('STEREO RECEIVER',752,413,10,'rgba(130,215,240,.95)','left',4);
  glowText('88-108',906,396,13,NEON,'right',8);
  glowText('MHz',906,413,10,'rgba(130,215,240,.95)','right',4);
  g.restore();

  /* ----- meters ----- */
  let off=near&&stations.length?clamp((pos-near.pos)/(gap*1.2),-1,1):0;
  if(playing)off+=(Math.random()-.5)*.05;
  smoothTune+=(off-smoothTune)*.25;
  meter(740,430,84,66,clamp(vu*1.1),t('m_level'),false,A);
  meter(830,430,87,66,smoothTune,t('m_tune'),true,A);

  /* ----- button strips ----- */
  inlay(186,514,520,42);inlay(740,514,176,42);
  g.save();g.globalAlpha=powered?1:.5;
  BT.forEach((b,i)=>{
    const x=BX[i],on=powered&&b.lit(),pr=now<pressed[i];
    led(x,525,on||pr);
    glowText(t(b.k),x,545,12.5,on||pr?HI:'rgba(25,211,255,.95)','center',on||pr?10:5);
    if(on||pr){
      g.save();g.shadowColor=NEON;g.shadowBlur=pr?18:10;g.strokeStyle=pr?HI:NEON;g.lineWidth=2;
      rr(x-19.5,BY-19.5,39,39,4);g.stroke();
      if(pr){g.fillStyle='rgba(25,211,255,.22)';g.fill()}
      g.restore();
    }
  });
  KN.forEach(n=>{
    glowText(t('k_'+n.k),n.x,545,12.5,'rgba(25,211,255,.95)','center',5);
    const v=n.k==='tune'?pos:(muted?0:$('vol').value/100),s0=Math.PI*.75,s1=s0+Math.PI*1.5;
    g.lineCap='round';g.lineWidth=2.5;
    g.beginPath();g.strokeStyle='rgba(25,211,255,.2)';g.arc(n.x,n.y,28,s0,s1);g.stroke();
    if(v>0.002){g.beginPath();g.strokeStyle=NEON;g.shadowColor=NEON;g.shadowBlur=10;g.arc(n.x,n.y,28,s0,s0+v*Math.PI*1.5);g.stroke();g.shadowBlur=0}
    const a=s0+v*Math.PI*1.5;
    g.strokeStyle='#fff';g.lineWidth=2.5;g.shadowColor=NEON;g.shadowBlur=9;
    g.beginPath();g.moveTo(n.x+Math.cos(a)*9,n.y+Math.sin(a)*9);g.lineTo(n.x+Math.cos(a)*20,n.y+Math.sin(a)*20);g.stroke();
    g.shadowBlur=0;g.lineCap='butt';
  });
  g.restore();
}

function shareText(){
  const head=t('shareHead');
  if(cur<0||!stations[cur])return head+'\n\n'+APP_URL;
  const s=stations[cur];
  return head+'\n\n'+s.name+'\n'+APP_URL+'?s='+encodeURIComponent(s.name)+'&u='+encodeURIComponent(s.url)+(s.cc?'&c='+encodeURIComponent(s.cc):'');
}
function legacyCopy(x){try{const ta=document.createElement('textarea');ta.value=x;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,x.length);document.execCommand('copy');document.body.removeChild(ta)}catch(e){}}
function copyText(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(x).catch(()=>legacyCopy(x))}catch(e){}legacyCopy(x)}
let toastEl=null,toastT=0;
function toast(m){
  if(!toastEl){toastEl=document.createElement('div');toastEl.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:90vw;padding:12px 18px;border-radius:22px;background:#031020;border:1px solid #19d3ff88;color:#19d3ff;font:600 14px/1.3 system-ui,sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:opacity .3s;pointer-events:none;text-align:center';document.body.appendChild(toastEl)}
  toastEl.textContent=m;toastEl.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.style.opacity='0'},4000);
}
const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
let shareBlob=null,shareFile=null,shareImgP=null;
function prepShareImage(){
  if(shareImgP)return shareImgP;
  shareImgP=fetch(SHARE_IMG).then(r=>r.blob()).then(b=>createImageBitmap(b)).then(bm=>{
    const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
    return new Promise((ok,ko)=>c.toBlob(x=>x?ok(x):ko(),'image/png'));
  }).then(png=>{shareBlob=png;try{shareFile=new File([png],'fmpro.png',{type:'image/png'})}catch(e){}return png});
  shareImgP.catch(()=>{});return shareImgP;
}
setTimeout(prepShareImage,600);
function openWAApp(enc){
  const fell=setTimeout(()=>{if(!document.hidden)location.href='https://wa.me/?text='+enc},1500);
  document.addEventListener('visibilitychange',function once(){if(document.hidden){clearTimeout(fell);document.removeEventListener('visibilitychange',once)}});
  location.href='whatsapp://send?text='+enc;
}
function waShare(){
  const msg=shareText(),enc=encodeURIComponent(msg);
  if(isMobile){
    const canFile=shareFile&&navigator.share&&navigator.canShare&&navigator.canShare({files:[shareFile]});
    if(canFile){navigator.share({files:[shareFile],text:msg}).catch(e=>{if(e&&e.name==='AbortError')return;openWAApp(enc)});return}
    prepShareImage();openWAApp(enc);return;
  }
  let wrote=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
      const pr=shareBlob?Promise.resolve(shareBlob):prepShareImage();
      navigator.clipboard.write([new ClipboardItem({'image/png':pr})]).then(()=>toast(t('copiedImg'))).catch(()=>{copyText(msg);toast(t('copied'))});
      wrote=true;
    }
  }catch(e){}
  if(!wrote){copyText(msg);toast(t('copied'))}
  const w=window.open('https://web.whatsapp.com/send?text='+enc,'_blank');
  try{if(w)w.opener=null}catch(e){}
  if(!w)location.href='https://web.whatsapp.com/send?text='+enc;
}

/* ============ nav transport buttons ============ */
(function(){
  const btns=[...document.querySelectorAll('#tb button')];
  const keys=['b_prev','b_play','b_next','b_scan','b_mute'];
  btns.forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(!powered){powerOn();return}
    pressed[i]=performance.now()+220;BT[i].f();sync();
  })});
  function sync(){
    btns.forEach((b,i)=>{
      const txt=(T[lang][keys[i]]||'');
      let label=txt;
      if(i===3&&scanning&&T[lang].scanOn)label=T[lang].scanOn;
      if(i===4&&muted&&T[lang].unmute)label=T[lang].unmute;
      if(i===1)label=(powered&&playFlag)?'||':txt;
      const sp=b.firstElementChild.nextElementSibling;
      if(sp.textContent!==label)sp.textContent=label;
      b.classList.toggle('on',!!BT[i].lit());
      b.setAttribute('aria-label',txt);
    });
  }
  setInterval(sync,150);sync();
})();

var song='';
(function(){

    const full='\u266A '+txt;

      box.textContent='';

  }
  const SOMA={};
  async function jget(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
  async function viaApi(url){
    let m=url.match(/somafm\.com\/([a-z0-9]+)-/i);
    if(m){
      const d=await jget('https://somafm.com/channels.json');
      const c=(d.channels||[]).find(c=>c.id===m[1]);
      if(c&&c.lastPlaying)return c.lastPlaying;
      throw 0;
    }
    m=url.match(/stream\.radioparadise\.com\/([a-z-]+?)-?\d*(?:\.|$|\/)/i)||url.match(/stream\.radioparadise\.com\/([a-z0-9-]+)/i);
    if(m){
      const n=m[1].toLowerCase(),ch=n.startsWith('mellow')?1:n.startsWith('rock')?2:n.startsWith('global')?3:0;
      const d=await jget('https://api.radioparadise.com/api/now_playing?chan='+ch);
      if(d&&d.title)return (d.artist?d.artist+' - ':'')+d.title;
      throw 0;
    }
    throw 0;
  }

    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),9000);
    try{
      const r=await fetch(url,{headers:{'Icy-MetaData':'1'},signal:ac.signal,cache:'no-store'});
      const mi=parseInt(r.headers.get('icy-metaint')||'0',10);
      if(!mi||!r.body)throw 0;
      const rd=r.body.getReader();let buf=new Uint8Array(0),need=mi+1;
      while(true){
        const {value,done}=await rd.read();if(done)throw 0;
        const nb=new Uint8Array(buf.length+value.length);nb.set(buf);nb.set(value,buf.length);buf=nb;
        if(buf.length>=need&&need===mi+1){const len=buf[mi]*16;if(len===0)throw 0;need=mi+1+len}
        if(need>mi+1&&buf.length>=need){
          const txt=new TextDecoder('utf-8').decode(buf.slice(mi+1,need));
          const m=txt.match(/StreamTitle='([^]*?)';/);
          rd.cancel();
          if(m&&m[1].trim())return m[1];
          throw 0;
        }
        if(buf.length>mi+4096+4096&&need===mi+1)throw 0;
      }
    }finally{clearTimeout(to);ac.abort()}
  }
  async function fetchSong(s,my){
    let t=null;
    try{t=await viaApi(s.url)}catch(e){try{t=await viaIcy(s.url)}catch(e2){}}
    if(my!==tok)return;
    if(t){
      t=String(t).replace(/^\s*-\s*|\s*-\s*$/g,'');
      if(t.toLowerCase()!==(s.name||'').toLowerCase())show(t);
    }
  }
  function tick(){
    const s=stations[cur];
    if(!powered||!s||!playFlag){return}
    const k=cur+'|'+s.url;
    if(k!==key){key=k;tok++;show('');fetchSong(s,tok);clearInterval(timer);timer=setInterval(()=>{const s2=stations[cur];if(s2&&playFlag&&cur+'|'+s2.url===key)fetchSong(s2,tok)},15000)}
  }
  setInterval(tick,700);
  /* clear when station changes or stops */
  setInterval(()=>{const s=stations[cur];const k=s?cur+'|'+s.url:'';if(k!==key&&song){key='';tok++;show('')}},300);
})();
</script>
